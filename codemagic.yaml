workflows:
  solapath-ios-testflight:
    name: SOLAPATH — iOS TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: SOLAPATH App Store Connect
    environment:
      groups:
        - solapath_client
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.rfgforge.solapath
        EXPECTED_BUILD_NUMBER: "168"
        EXPECTED_MARKETING_VERSION: "0.3.0"
      node: latest
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rfgforge.solapath
    cache:
      cache_paths:
        - $HOME/.npm
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Lint
        script: |
          npm run lint
      - name: Typecheck
        script: |
          npm run typecheck
      - name: Language contract
        script: |
          npm run test:language
      - name: Build web application
        script: |
          npm run build:web
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Verify Xcode project
        script: |
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -list
      - name: Assert Release version and build number
        script: |
          RELEASE_SETTINGS=$(xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release -showBuildSettings)
          RELEASE_BUILD=$(echo "$RELEASE_SETTINGS" | awk -F' = ' '$1 ~ /^ *CURRENT_PROJECT_VERSION$/ {print $2; exit}')
          RELEASE_MARKETING=$(echo "$RELEASE_SETTINGS" | awk -F' = ' '$1 ~ /^ *MARKETING_VERSION$/ {print $2; exit}')
          if [ "$RELEASE_MARKETING" != "$EXPECTED_MARKETING_VERSION" ]; then
            echo "Release MARKETING_VERSION is '$RELEASE_MARKETING', expected '$EXPECTED_MARKETING_VERSION'"
            exit 1
          fi
          if [ "$RELEASE_BUILD" != "$EXPECTED_BUILD_NUMBER" ]; then
            echo "Release CURRENT_PROJECT_VERSION is '$RELEASE_BUILD', expected '$EXPECTED_BUILD_NUMBER'"
            exit 1
          fi
      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"
      - name: Assert push entitlement in signed build
        script: |
          IPA=$(ls ios/App/build/ios/ipa/*.ipa | head -n 1)
          EXTRACT_DIR=$(mktemp -d)
          unzip -q "$IPA" -d "$EXTRACT_DIR"
          APP=$(ls -d "$EXTRACT_DIR"/Payload/*.app | head -n 1)
          APS_ENV=$(codesign -d --entitlements :- "$APP" 2>/dev/null | plutil -extract aps-environment raw -o - -)
          if [ "$APS_ENV" != "production" ]; then
            echo "Signed build aps-environment is '$APS_ENV', expected 'production'"
            exit 1
          fi
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  solapath-android-verify:
    name: SOLAPATH — Android 0.3.0 Verification
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - solapath_client
      vars:
        PACKAGE_NAME: com.rfgforge.solapath
        EXPECTED_ANDROID_VERSION_CODE: "167"
        EXPECTED_ANDROID_VERSION_NAME: "0.3.0"
      node: latest
      java: 17
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Lint
        script: |
          npm run lint
      - name: Typecheck
        script: |
          npm run typecheck
      - name: Language contract
        script: |
          npm run test:language
      - name: Build web application
        script: |
          npm run build:web
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Assert Android version
        script: |
          VERSION_CODE=$(grep -E '^[[:space:]]*versionCode ' android/app/build.gradle | awk '{print $2}')
          VERSION_NAME=$(grep -E '^[[:space:]]*versionName ' android/app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')
          if [ "$VERSION_CODE" != "$EXPECTED_ANDROID_VERSION_CODE" ]; then
            echo "Android versionCode is '$VERSION_CODE', expected '$EXPECTED_ANDROID_VERSION_CODE'"
            exit 1
          fi
          if [ "$VERSION_NAME" != "$EXPECTED_ANDROID_VERSION_NAME" ]; then
            echo "Android versionName is '$VERSION_NAME', expected '$EXPECTED_ANDROID_VERSION_NAME'"
            exit 1
          fi
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build Android release bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/reports/**/*

