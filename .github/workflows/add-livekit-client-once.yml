name: Add LiveKit Client Dependency

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-livekit-client-once.yml"

permissions:
  contents: write

jobs:
  add-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add official LiveKit browser SDK
        run: npm install --save-exact livekit-client@2.24.1

      - name: Commit lockfile-safe dependency update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "LiveKit client dependency is already current."
            exit 0
          fi
          git commit -m "0.3.0: add LiveKit listener client"
          git pull --rebase origin main
          git push origin HEAD:main
