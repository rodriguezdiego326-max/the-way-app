name: Deploy SOLAPATH LiveKit Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "livekit-agent/**"
      - "!livekit-agent/livekit.toml"
      - "!livekit-agent/README.md"
      - "!livekit-agent/**/*.md"
      - ".github/workflows/deploy-livekit-agent.yml"

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: livekit-agent-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Recover existing LiveKit agent or choose create mode
        id: mode
        shell: bash
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LK_NO_SKILLS_PROMPT: "1"
        run: |
          set -euo pipefail

          if [ -f "livekit-agent/livekit.toml" ]; then
            echo "operation=deploy" >> "$GITHUB_OUTPUT"
            echo "config_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          curl -sSL https://get.livekit.io/cli | bash

          lk agent list --json > /tmp/livekit-agents.json
          AGENT_ID="$(jq -r '.. | strings | select(startswith("CA_"))' /tmp/livekit-agents.json | head -n 1)"

          if [ -n "$AGENT_ID" ]; then
            echo "Recovering existing LiveKit agent configuration."
            lk agent config --id "$AGENT_ID" livekit-agent
            test -f "livekit-agent/livekit.toml"
            echo "operation=deploy" >> "$GITHUB_OUTPUT"
            echo "config_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existing agent found; first deployment will create one."
            echo "operation=create" >> "$GITHUB_OUTPUT"
            echo "config_created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or deploy SOLAPATH sermon translator
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          OPERATION: ${{ steps.mode.outputs.operation }}
          WORKING_DIRECTORY: livekit-agent
          TIMEOUT: 5m

      - name: Persist LiveKit agent configuration
        if: steps.mode.outputs.config_created == 'true' || steps.mode.outputs.operation == 'create'
        shell: bash
        run: |
          if [ ! -f "livekit-agent/livekit.toml" ]; then
            echo "LiveKit operation completed without a livekit.toml"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livekit-agent/livekit.toml
          if git diff --cached --quiet; then
            echo "No LiveKit configuration change to persist."
          else
            git commit -m "0.3.0: register SOLAPATH LiveKit agent"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Wait for LiveKit agent to be running
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: livekit-agent
          TIMEOUT: 5m
