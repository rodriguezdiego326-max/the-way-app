name: Validate SOLAPATH

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/youtube-live-translation
    paths:
      - "src/**"
      - "shared/**"
      - "supabase/functions/church-stream-source/**"
      - "supabase/functions/church-audio-pair/**"
      - "sender.html"
      - "vite.sender.config.ts"
      - "supabase/functions/church-youtube-live-source/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "capacitor.config.ts"
      - "vite.config.*"
      - "tsconfig*.json"
      - ".github/workflows/validate-solapath.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Language contract
        run: npm run test:language

      - name: Church stream failures and timeout recovery
        run: npm run test:church-stream

      - name: Translation measurements and owner grants
        run: npm run test:translation-measurement

      - name: Church directory identity and personal hiding
        run: npm run test:church-choices

      - name: Church visitor permissions and invitations
        run: npm run test:church-membership

      - name: Production web build
        run: npm run build:web

      - name: Computer audio sender build
        run: npm run build:sender
