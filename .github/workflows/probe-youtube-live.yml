name: Probe SOLAPATH YouTube Live Source

on:
  push:
    branches:
      - feature/youtube-live-translation
    paths:
      - ".github/workflows/probe-youtube-live.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_YOUTUBE_URL: "https://www.youtube.com/live/hNGObmydgcE?feature=shared"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Probe YouTube live status
        shell: bash
        run: |
          set -euo pipefail
          yt-dlp --dump-single-json --skip-download "$TEST_YOUTUBE_URL" > /tmp/youtube.json
          python - <<'PY'
          import json
          from urllib.parse import urlparse

          with open('/tmp/youtube.json', 'r', encoding='utf-8') as fh:
              info = json.load(fh)

          formats = info.get('formats') or []
          hls_urls = []
          for fmt in formats:
              url = fmt.get('url')
              protocol = str(fmt.get('protocol') or '')
              manifest = fmt.get('manifest_url')
              for candidate in (manifest, url):
                  if isinstance(candidate, str) and ('.m3u8' in candidate or 'm3u8' in protocol):
                      hls_urls.append(candidate)

          print('VIDEO_ID=' + str(info.get('id') or ''))
          print('TITLE=' + str(info.get('title') or ''))
          print('LIVE_STATUS=' + str(info.get('live_status') or ''))
          print('IS_LIVE=' + str(bool(info.get('is_live'))).lower())
          print('WAS_LIVE=' + str(bool(info.get('was_live'))).lower())
          print('HAS_HLS=' + str(bool(hls_urls)).lower())
          print('HLS_HOST=' + (urlparse(hls_urls[0]).hostname if hls_urls else ''))
          print('PROBE_RESULT=' + ('resolvable_live_hls' if info.get('is_live') and hls_urls else 'not_currently_live'))
          PY
