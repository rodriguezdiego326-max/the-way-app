name: LiveKit Room Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/livekit-room-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect SOLAPATH church room
        shell: bash
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LK_NO_SKILLS_PROMPT: "1"
        run: |
          set -euo pipefail
          curl -sSL https://get.livekit.io/cli | bash

          ROOM="church-4833b094-1f84-4415-8168-2ff3fea466fb"

          echo "=== ROOM LOW LATENCY DIAGNOSTIC ==="
          lk room list --json "$ROOM" || true

          echo "=== PARTICIPANTS ==="
          lk room participants list "$ROOM" | tee /tmp/participants.txt || true

          echo "=== PARTICIPANT DETAILS ==="
          if [ -s /tmp/participants.txt ]; then
            awk '{print $1}' /tmp/participants.txt | while read -r IDENTITY; do
              [ -z "$IDENTITY" ] && continue
              echo "--- $IDENTITY ---"
              lk room participants get --room "$ROOM" "$IDENTITY" || true
            done
          fi

          echo "=== FORCE LISTENER AUDIO SUBSCRIPTION ==="
          LISTENER_ID="$(awk '{print $1}' /tmp/participants.txt | grep -v '^church-feed-' | grep -v '^agent-' | head -n 1 || true)"
          AGENT_ID="$(awk '{print $1}' /tmp/participants.txt | grep '^agent-' | head -n 1 || true)"
          if [ -n "$LISTENER_ID" ] && [ -n "$AGENT_ID" ]; then
            AGENT_TRACK="$(lk room participants get --room "$ROOM" "$AGENT_ID" | jq -r '.tracks[]? | select(.mimeType | startswith("audio/")) | .sid' | head -n 1)"
            if [ -n "$AGENT_TRACK" ] && [ "$AGENT_TRACK" != "null" ]; then
              echo "Subscribing listener $LISTENER_ID to agent audio track $AGENT_TRACK"
              lk room update-subscriptions --room "$ROOM" --identity "$LISTENER_ID" --subscribe "$AGENT_TRACK" || true
            fi
          fi

          echo "=== DISPATCH ==="
          lk dispatch list --json "$ROOM" || true

          echo "=== AGENT STATUS ==="
          cd livekit-agent
          lk agent status || true

          echo "=== AGENT RUNTIME LOG SNAPSHOT ==="
          timeout 12s lk agent logs || true
